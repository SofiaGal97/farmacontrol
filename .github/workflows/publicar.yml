# ============================================================
# PUBLICACIÓN AUTOMÁTICA EN GITHUB PAGES (gratis)
# Cada vez que se sube código a la rama "main", GitHub:
#   1. instala las librerías, 2. compila la página, 3. la publica.
# El link queda así: https://<usuario>.github.io/<repositorio>/
# ============================================================
name: Publicar FarmaControl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
