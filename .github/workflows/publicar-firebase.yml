# ============================================================
# PUBLICACIÓN AUTOMÁTICA EN FIREBASE (gratis)
# Cada vez que se sube código a la rama "main":
#   1. Se instalan las librerías y se compila la página.
#   2. Se publica la página en Firebase Hosting.
#   3. Se intenta publicar las reglas de seguridad (firestore.rules).
#      Si la cuenta de servicio no tiene el rol "Firebase Rules Admin",
#      este paso se omite y las reglas se pegan a mano en la consola.
# Link: https://farmacontrol-2cd80.web.app
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT en GitHub
# (Settings → Secrets and variables → Actions).
# ============================================================
name: Publicar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FIREBASE_TOOLS: firebase-tools@13.35.1

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_BASE: /

      - name: Preparar credenciales
        env:
          CUENTA_SERVICIO: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$CUENTA_SERVICIO" > "$RUNNER_TEMP/cuenta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cuenta.json" >> "$GITHUB_ENV"

      - name: Publicar página
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting --project farmacontrol-2cd80 --non-interactive

      - name: Publicar reglas de seguridad
        continue-on-error: true
        run: npx --yes "$FIREBASE_TOOLS" deploy --only firestore:rules --project farmacontrol-2cd80 --non-interactive

      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/cuenta.json"
